<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: draw behind the notch / home bar; the CSS keeps content clear of them -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13120f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <title>Habits</title>
    <style>
      /* Shown only until the app has loaded (then #root is no longer empty). */
      html { background: #13120f; color-scheme: dark; }
      #root:empty { min-height: 100vh; display: grid; place-items: center; }
      #root:empty::before {
        content: ''; width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid #2f2c27; border-top-color: #c68a3d;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #root:empty::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
